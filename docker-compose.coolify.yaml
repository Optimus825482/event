# ===========================================
# EventFlow PRO (web/) - Coolify Production Setup
# ===========================================
# Coolify Docker Compose Build Pack. Traefik etiketlerini Coolify, "web" servisine atanan alan adından üretir
# (Coolify'da web servisi için alan adını :3000 portuyla tanımlayın). İstemci IP'sini Traefik x-real-ip
# başlığıyla iletir; bu yüzden TRUSTED_IP_HEADER=x-real-ip verilmelidir.
# Eski yığın: docker-compose.legacy.coolify.yaml (geri dönüş için).
#
# `satis` (satis/): herkese açık satış sitesi; ikinci alan adı (SALES_SITE_URL) Coolify'da `satis` servisine :3000 ile
# atanır. Çekirdeğe yalnızca iç ağdan `http://eventflow-core:3000` ile gider (web servisinin `default` ağındaki takma adı).
# Çekirdeğin `/api/sales` yolu dışarıya `web` etiketleriyle kapatılır (yüksek öncelikli Traefik yönlendiricisi).
# UYARI: bu etiketler kapsayıcıda denenmedi; dağıtım sonrası dışarıdan `curl https://<çekirdek alan adı>/api/sales/...`
# ile yolun kapalı olduğu doğrulanmalıdır.
#
# Zorunlu ortam değişkenleri eksikse `docker compose config` başarısız olur (${VAR:?...}).

# İmaj sunucuda, deploy edilen commit'in kaynağından derlenir (GitHub Actions / kayıt defteri yok): çalışan sürüm her
# zaman deploy edilen commit'tir. Derleme `migrate` servisinde tanımlıdır; `web` ve `create-admin` aynı imajı kullanır.
# `pull_policy: build`, Coolify ayrı bir derleme adımı çalıştırmasa bile `up -d` sırasında yeniden derlemeyi zorlar
# (kaynak değişmediyse katman önbelleğinden saniyeler sürer).

x-web-env: &web-env
  NODE_ENV: production
  DATABASE_URL: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:?DB_PASSWORD zorunlu}@eventflow-db:5432/${DB_NAME:-eventflow}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET zorunlu (en az 32 karakter)}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL zorunlu (https://...)}
  TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:?TRUSTED_IP_HEADER zorunlu (Traefik arkasında x-real-ip)}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY zorunlu (openssl rand -base64 32)}
  QR_SIGNING_KEY: ${QR_SIGNING_KEY:-}
  SALES_API_SECRET: ${SALES_API_SECRET:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
  SALES_SITE_URL: ${SALES_SITE_URL:-}
  UPLOAD_DIR: /data/uploads

services:
  # PostgreSQL (port yayınlanmaz; yalnızca iç ağdan erişilir).
  # Servis adı bilerek benzersizdir: web, paylaşılan `coolify` ağına da bağlıdır ve orada başka projelerin
  # `postgres` adlı servisleri olabilir; genel ad yanlış veritabanına çözümlenir.
  eventflow-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD zorunlu}
      POSTGRES_DB: ${DB_NAME:-eventflow}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-eventflow} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Tek seferlik veritabanı geçişi; web yalnızca bu başarıyla bittikten sonra başlar.
  migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: eventflow-web:coolify
    pull_policy: build
    restart: "no"
    # Şemayı kurar; ADMIN_PASSWORD verilmişse ilk yöneticiyi de oluşturur (kullanıcı adı ADMIN_USERNAME, varsayılan
    # `admin`). Etkin bir yönetici zaten varsa dokunmaz (çıkış kodu 2 başarı sayılır). Parola en az 12 karakter
    # değilse bu adım hata verir ve web başlamaz; nedeni bu kapsayıcının günlüğünde yazar.
    command: ["node", "-e", "const { spawnSync } = require('node:child_process'); const run = (args) => spawnSync('node', args, { stdio: 'inherit' }).status; let code = run(['/opt/migrator/migrate.mjs']); if (code !== 0) process.exit(code || 1); if (process.env.ADMIN_PASSWORD) { code = run(['/opt/migrator/create-admin.mjs', process.env.ADMIN_USERNAME || 'admin']); if (code !== 0 && code !== 2) process.exit(code || 1); }"]
    depends_on:
      eventflow-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:?DB_PASSWORD zorunlu}@eventflow-db:5432/${DB_NAME:-eventflow}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - default

  # Tek seferlik araç: ilk yöneticiyi oluşturur / parolasını sıfırlar (--reset). Profil `tools` olduğundan
  # Coolify dağıtımında başlamaz; sunucuda `docker compose run` ile çalıştırılır (bkz. DEPLOYMENT.md).
  create-admin:
    image: eventflow-web:coolify
    pull_policy: never
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["node", "/opt/migrator/create-admin.mjs"]
    depends_on:
      eventflow-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:?DB_PASSWORD zorunlu}@eventflow-db:5432/${DB_NAME:-eventflow}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - default

  # Next.js uygulaması (standalone)
  web:
    image: eventflow-web:coolify
    pull_policy: never
    restart: unless-stopped
    depends_on:
      eventflow-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *web-env
    volumes:
      - web_uploads_data:/data/uploads
    expose:
      - "3000"
    healthcheck:
      # Başarısızlık nedeni `docker inspect <web> --format '{{json .State.Health}}'` çıktısında görünür.
      # Vekil, kapsayıcı "healthy" olana dek 503 "no available server" döner; kısa aralık bu süreyi kısaltır.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async (r) => { if (!r.ok) { console.error(r.status, await r.text()); process.exit(1); } }).catch((e) => { console.error(String(e)); process.exit(1); })"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      coolify: {}
      default:
        # Paylaşılan `coolify` ağındaki başka `web` adlarıyla karışmasın: satis çekirdeğe bu takma adla gider.
        aliases:
          - eventflow-core
    labels:
      # İki router: TLS'siz router HTTPS isteklerini eşlemez, bu yüzden http ve https ayrı tanımlanır.
      # `/api/sales` yolunu dışarıdan kapatır (içeriden satis doğrudan eventflow-core:3000'e gider). Kapsayıcıda denenmedi.
      - traefik.http.middlewares.eventflow-sales-block.replacepath.path=/__satis-api-disaridan-kapali
      - traefik.http.routers.eventflow-sales-block.rule=Host(`${WEB_PUBLIC_HOST:?WEB_PUBLIC_HOST zorunlu (çekirdeğin alan adı, şemasız)}`) && PathPrefix(`/api/sales`)
      - traefik.http.routers.eventflow-sales-block.priority=1000
      - traefik.http.routers.eventflow-sales-block.entrypoints=http
      - traefik.http.routers.eventflow-sales-block.middlewares=eventflow-sales-block
      - traefik.http.routers.eventflow-sales-block.service=eventflow-sales-block
      - traefik.http.routers.eventflow-sales-block-tls.rule=Host(`${WEB_PUBLIC_HOST:?WEB_PUBLIC_HOST zorunlu (çekirdeğin alan adı, şemasız)}`) && PathPrefix(`/api/sales`)
      - traefik.http.routers.eventflow-sales-block-tls.priority=1000
      - traefik.http.routers.eventflow-sales-block-tls.entrypoints=https
      - traefik.http.routers.eventflow-sales-block-tls.tls=true
      - traefik.http.routers.eventflow-sales-block-tls.tls.certresolver=letsencrypt
      - traefik.http.routers.eventflow-sales-block-tls.middlewares=eventflow-sales-block
      - traefik.http.routers.eventflow-sales-block-tls.service=eventflow-sales-block
      - traefik.http.services.eventflow-sales-block.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Herkese açık satış sitesi (satis/, standalone). Çekirdeğe iç ağdan gider; port yayınlanmaz.
  satis:
    build:
      context: ./satis
      dockerfile: Dockerfile
    image: eventflow-satis:coolify
    pull_policy: build
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CORE_API_URL: http://eventflow-core:3000
      SALES_API_SECRET: ${SALES_API_SECRET:?SALES_API_SECRET zorunlu (en az 32 karakter)}
      SITE_URL: ${SALES_SITE_URL:?SALES_SITE_URL zorunlu (https://...)}
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:?TRUSTED_IP_HEADER zorunlu (Traefik arkasında x-real-ip)}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async (r) => { if (!r.ok) { console.error(r.status, await r.text()); process.exit(1); } }).catch((e) => { console.error(String(e)); process.exit(1); })"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - coolify
      - default
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  web_postgres_data:
  web_uploads_data:

networks:
  coolify:
    external: true
  default:
    driver: bridge
