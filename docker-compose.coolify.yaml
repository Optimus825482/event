# ===========================================
# EventFlow PRO (web/) - Coolify Production Setup
# ===========================================
# Coolify Docker Compose Build Pack. Traefik etiketlerini Coolify, "web" servisine atanan alan adından üretir
# (Coolify'da web servisi için alan adını :3000 portuyla tanımlayın). İstemci IP'sini Traefik x-real-ip
# başlığıyla iletir; bu yüzden TRUSTED_IP_HEADER=x-real-ip verilmelidir.
# Eski yığın: docker-compose.legacy.coolify.yaml (geri dönüş için).
#
# Zorunlu ortam değişkenleri eksikse `docker compose config` başarısız olur (${VAR:?...}).

x-web-env: &web-env
  NODE_ENV: production
  DATABASE_URL: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:?DB_PASSWORD zorunlu}@postgres:5432/${DB_NAME:-eventflow}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET zorunlu (en az 32 karakter)}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL zorunlu (https://...)}
  TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:?TRUSTED_IP_HEADER zorunlu (Traefik arkasında x-real-ip)}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY zorunlu (openssl rand -base64 32)}
  QR_SIGNING_KEY: ${QR_SIGNING_KEY:-}
  UPLOAD_DIR: /data/uploads

services:
  # PostgreSQL (port yayınlanmaz; yalnızca iç ağdan erişilir)
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD zorunlu}
      POSTGRES_DB: ${DB_NAME:-eventflow}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-eventflow} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Tek seferlik veritabanı geçişi; web yalnızca bu başarıyla bittikten sonra başlar.
  migrate:
    image: ${WEB_IMAGE:-ghcr.io/optimus825482/eventflow-web:latest}
    restart: "no"
    command: ["node", "/opt/migrator/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:?DB_PASSWORD zorunlu}@postgres:5432/${DB_NAME:-eventflow}
    networks:
      - default

  # Next.js uygulaması (standalone)
  web:
    image: ${WEB_IMAGE:-ghcr.io/optimus825482/eventflow-web:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *web-env
    volumes:
      - web_uploads_data:/data/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - coolify
      - default
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  web_postgres_data:
  web_uploads_data:

networks:
  coolify:
    external: true
  default:
    driver: bridge
