<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Çevrimdışı | EventFlow</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; }
      main { max-width: 28rem; padding: 1.5rem; text-align: center; }
      a, button { color: #0f172a; background: #38bdf8; border: 0; border-radius: 0.5rem; padding: 0.75rem 1.25rem; font: inherit; font-weight: 600; text-decoration: none; display: inline-block; cursor: pointer; }
      p { line-height: 1.5; color: #cbd5e1; }
    </style>
  </head>
  <body>
    <main>
      <h1>Çevrimdışısınız</h1>
      <p>Bu sayfa daha önce çevrimiçiyken açılmadığı için çevrimdışı gösterilemiyor. Bağlantı gelince yeniden deneyin. Kuyruğa alınmış girişler kaybolmaz; kapı ekranını açtığınızda gönderilir.</p>
      <button type="button" onclick="location.reload()">Yeniden dene</button>
      <p><a href="/check-in">Kapı girişi</a></p>
    </main>
  </body>
</html>
