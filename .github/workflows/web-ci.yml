name: web-ci

on:
  # build-and-push.yml bu iş akışını `needs:` ile çağırır: kırmızı bir commit'ten web imajı üretilmez.
  workflow_call:
  pull_request:
    paths:
      - "web/**"
  push:
    paths:
      - "web/**"

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DATABASE_URL: postgres://postgres@localhost:54329/eventflow_dev
      BETTER_AUTH_SECRET: ci-dummy-secret-not-a-real-credential-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # Geliştirme, compose ve Coolify ile aynı harmanlama (C).
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Create dev database
        env:
          PGHOST: localhost
          PGPORT: "54329"
          PGUSER: postgres
        run: |
          if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'eventflow_dev'" postgres | grep -q 1; then
            psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE eventflow_dev" postgres
          fi

      - name: Apply migrations
        run: npm run db:migrate

      - name: Apply migrations again (runtime migrator, must be a no-op)
        run: npm run db:migrate:runtime

      - name: Build
        run: npm run build
