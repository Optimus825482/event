name: web-ci

on:
  # build-and-push.yml bu iş akışını `needs:` ile çağırır: kırmızı bir commit'ten web imajı üretilmez.
  workflow_call:
  pull_request:
    paths:
      - "web/**"
      - "docker-compose.yml"
      - ".github/workflows/web-ci.yml"
  push:
    paths:
      - "web/**"
      - "docker-compose.yml"
      - ".github/workflows/web-ci.yml"

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DATABASE_URL: postgres://postgres@localhost:54329/eventflow_dev
      BETTER_AUTH_SECRET: ci-dummy-secret-not-a-real-credential-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # Geliştirme, compose ve Coolify ile aynı harmanlama (C).
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Create dev database
        env:
          PGHOST: localhost
          PGPORT: "54329"
          PGUSER: postgres
        run: |
          if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'eventflow_dev'" postgres | grep -q 1; then
            psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE eventflow_dev" postgres
          fi

      - name: Apply migrations
        run: npm run db:migrate

      - name: Apply migrations again (runtime migrator, must be a no-op)
        run: npm run db:migrate:runtime

      - name: Build
        run: npm run build

  # Üretim imajını derler ve compose yığınını gerçekten ayağa kaldırır (yayın yapmaz):
  # postgres -> migrate (tek seferlik) -> web sağlıklı -> ilk yönetici betiği.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate throwaway secrets
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=https://eventflow.invalid"
            echo "TRUSTED_IP_HEADER=x-real-ip"
            echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Build image and start the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "web did not become healthy in time"
          exit 1

      - name: Migrate service finished successfully
        run: test "$(docker inspect -f "{{.State.ExitCode}}" "$(docker compose ps -aq migrate)")" = "0"

      - name: Health endpoint answers
        run: curl --fail --silent --show-error http://127.0.0.1:3000/api/health

      - name: Login page is served with a Content-Security-Policy
        run: |
          curl --fail --silent --show-error -D headers.txt -o /dev/null http://127.0.0.1:3000/login
          grep -i "^content-security-policy:" headers.txt

      - name: First admin can be created; a second run refuses
        run: |
          docker compose run --rm -T create-admin ci-admin
          set +e
          docker compose run --rm -T create-admin ci-admin-2
          code=$?
          set -e
          test "$code" = "2"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Üretim imajını derler ve compose yığınını gerçekten ayağa kaldırır (yayın yapmaz):
  # postgres -> migrate (tek seferlik) -> web sağlıklı -> ilk yönetici betiği.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate throwaway secrets
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=https://eventflow.invalid"
            echo "TRUSTED_IP_HEADER=x-real-ip"
            echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Build image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Migrate service finished successfully
        run: test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")" = "0"

      - name: Health endpoint answers
        run: curl --fail --silent --show-error http://127.0.0.1:3000/api/health

      - name: Login page is served with a Content-Security-Policy
        run: |
          curl --fail --silent --show-error -D headers.txt -o /dev/null http://127.0.0.1:3000/login
          grep -i "^content-security-policy:" headers.txt

      - name: First admin can be created; a second run refuses
        run: |
          docker compose run --rm -T create-admin ci-admin
          set +e
          docker compose run --rm -T create-admin ci-admin-2
          code=$?
          set -e
          test "$code" = "2"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
