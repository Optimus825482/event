name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/optimus825482/eventflow-web

jobs:
  # Yeni uygulamanın lint + typecheck + test + build kapısı (web-ci.yml, workflow_call).
  web-test:
    permissions:
      contents: read
    uses: ./.github/workflows/web-ci.yml

  # Yalnızca web-test yeşilse çalışır; kırmızı commit'ten imaj üretilmez.
  build-web:
    needs: web-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
