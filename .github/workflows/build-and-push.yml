name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/optimus825482/eventflow-web

jobs:
  # Test kapısı yoktur: testler PR'da (web-ci.yml) koşar ve main'e yalnızca yeşil PR birleştirilir. Aynı testleri
  # burada yeniden beklemek imajı ~8 dakika geciktiriyordu; otomatik deploy imaj gönderilince tetiklenir.
  # main'e PR'sız atılan bir commit testsiz imaj üretir; web-ci yine de o commit için ayrıca koşar ve kırmızıyı gösterir.
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Katman önbelleği (GitHub Actions cache): bağımlılıklar değişmediyse `npm ci` katmanı yeniden kurulmaz.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Arayüzde "Güncelleme #N" olarak görünür; açık sekmeler bu numara değişince "Sistem güncellendi" der.
          build-args: |
            APP_BUILD=${{ github.run_number }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
