# EventFlow PRO (web/) - Docker Compose (Coolify dışı sunucu / yerel prova)
# Web yalnızca 127.0.0.1:3000'e bağlanır; önüne kendi ters vekilinizi (Traefik/nginx, HTTPS) koyun ve
# istemci IP başlığını TRUSTED_IP_HEADER ile belirtin. Volume adları eski yığınınkilerden bilerek farklıdır
# (eski PostgreSQL 15 verisi yeni 17 sunucusuna bağlanmasın).
# Eski yığın: docker-compose.legacy.yml (geri dönüş için). Postgres için port yayınlanmaz.
#
# Kullanım:
#   docker compose up -d --build        # postgres -> migrate (tek seferlik) -> web
#   printf %s "$PAROLA" | docker compose run --rm -T create-admin --password-stdin <kullanıcı-adı>   # ilk yönetici

x-db-url: &db-url postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:?DB_PASSWORD zorunlu}@postgres:5432/${DB_NAME:-eventflow}

services:
  postgres:
    image: postgres:17-alpine
    container_name: eventflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD zorunlu}
      POSTGRES_DB: ${DB_NAME:-eventflow}
      # Geliştirme, CI ve Coolify ile aynı harmanlama (C): ORDER BY ve metin karşılaştırmaları her yerde aynı sonucu verir.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - web_postgres_data:/var/lib/postgresql/data
    networks:
      - eventflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-eventflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: eventflow-web:local
    restart: "no"
    # Şemayı kurar; ADMIN_PASSWORD verilmişse ilk yöneticiyi de oluşturur (kullanıcı adı ADMIN_USERNAME, varsayılan
    # `admin`). Etkin bir yönetici zaten varsa dokunmaz (çıkış kodu 2 başarı sayılır). Parola en az 12 karakter
    # değilse bu adım hata verir ve web başlamaz; nedeni bu kapsayıcının günlüğünde yazar.
    command: ["node", "-e", "const { spawnSync } = require('node:child_process'); const run = (args) => spawnSync('node', args, { stdio: 'inherit' }).status; let code = run(['/opt/migrator/migrate.mjs']); if (code !== 0) process.exit(code || 1); if (process.env.ADMIN_PASSWORD) { code = run(['/opt/migrator/create-admin.mjs', process.env.ADMIN_USERNAME || 'admin']); if (code !== 0 && code !== 2) process.exit(code || 1); }"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *db-url
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - eventflow-network

  # Tek seferlik: ilk yöneticiyi oluşturur / parolasını sıfırlar (--reset). `up` ile başlamaz (profil: tools).
  # Parola komut satırında verilmez: stdin (--password-stdin) ya da ADMIN_PASSWORD ortam değişkeni.
  create-admin:
    image: eventflow-web:local
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["node", "/opt/migrator/create-admin.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *db-url
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - eventflow-network

  web:
    image: eventflow-web:local
    container_name: eventflow-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET zorunlu (en az 32 karakter)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL zorunlu (https://...)}
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:?TRUSTED_IP_HEADER zorunlu (Traefik arkasında x-real-ip)}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY zorunlu (openssl rand -base64 32)}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-}
      SALES_API_SECRET: ${SALES_API_SECRET:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      SALES_SITE_URL: ${SALES_SITE_URL:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - web_uploads_data:/data/uploads
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - eventflow-network

volumes:
  web_postgres_data:
  web_uploads_data:

networks:
  eventflow-network:
    driver: bridge
